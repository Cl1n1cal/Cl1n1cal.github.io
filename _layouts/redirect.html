<!DOCTYPE html>
<!-- Used by jekyll-redirect-from. Dark background so old links don't flash white before redirecting. -->
<html lang="en-US" style="background:#0d1117">
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Redirecting&hellip;</title>
  <link rel="canonical" href="{{ page.redirect.to }}">
  <script>location.replace("{{ page.redirect.to }}")</script>
  <meta http-equiv="refresh" content="0; url={{ page.redirect.to }}">
  <meta name="robots" content="noindex">
  <body style="background:#0d1117;color:#8b96a3;font-family:system-ui,sans-serif">
    <noscript><a href="{{ page.redirect.to }}" style="color:#5eead4">Click here if you are not redirected.</a></noscript>
  </body>
</html>
